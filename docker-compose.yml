services:

  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - user-data:/data

  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - product-data:/data

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    volumes:
      - order-data:/data
    depends_on:
      - user-service
      - product-service

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  user-data:
  product-data:
  order-data:
  grafana-data:
