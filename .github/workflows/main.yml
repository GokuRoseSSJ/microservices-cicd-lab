name: Microservices CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test User Service
        run: |
          cd user-service
          pip install -r requirements.txt
          python -m unittest test_app.py

      - name: Test Product Service
        run: |
          cd product-service
          pip install -r requirements.txt
          python -m unittest test_app.py

      - name: Test Order Service
        run: |
          cd order-service
          pip install -r requirements.txt
          python -m unittest test_app.py

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push User Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/microservices-user-service:latest ./user-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/microservices-user-service:latest

      - name: Build and push Product Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/microservices-product-service:latest ./product-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/microservices-product-service:latest

      - name: Build and push Order Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/microservices-order-service:latest ./order-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/microservices-order-service:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/microservices-lab
            git pull origin main
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker ps
